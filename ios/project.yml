name: FortWatchListener
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  FortWatchListener:
    type: application
    platform: iOS
    sources: [FortWatchListener]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fortwatch.spatiallistener
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FortWatch Listener
        INFOPLIST_KEY_NSMicrophoneUsageDescription: FortWatch reconoce sonidos y calcula su dirección en este iPhone para avisarte con la pulsera. El audio no sale del teléfono.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FortWatch se conecta directamente a tu pulsera para mostrar alertas y hacerla vibrar.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: FortWatchListener/Info.plist
      properties: {}
  FortWatchListenerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FortWatchListener
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fortwatch.spatiallistener.tests
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FortWatchListener:
    build:
      targets:
        FortWatchListener: all
    test:
      targets: [FortWatchListenerTests]
