; Optional: build/flash this sketch with PlatformIO instead of the Arduino IDE.
;   pio run -t upload        (from this folder)
; Same settings as the Arduino IDE table in the README: ESP32S3 Dev Module,
; USB CDC on boot, 16 MB flash, OPI PSRAM.
[platformio]
src_dir = .

[env:soundsense]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.extra_flags = -DBOARD_HAS_PSRAM
monitor_speed = 115200
lib_deps =
	moononournation/GFX Library for Arduino@1.5.0
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
